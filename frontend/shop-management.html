<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>店铺管理 — BARBERSHOP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #FAFAF8;
            --text: #1A1A1A;
            --text-muted: #8A8A8A;
            --accent: #C4A77D;
            --accent-hover: #B39567;
            --accent-light: rgba(196, 167, 125, 0.1);
            --border: #E8E8E4;
            --white: #FFFFFF;
            --error: #D64545;
            --success: #4A9D5B;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.04);
            --shadow-md: 0 8px 24px rgba(0,0,0,0.06);
            --shadow-lg: 0 16px 48px rgba(0,0,0,0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        ::selection {
            background: var(--accent);
            color: var(--white);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
        }

        h1, h2, h3, h4 {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 400;
            letter-spacing: 0.02em;
        }

        /* Header */
        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: rgba(250, 250, 248, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
        }

        header .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 48px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 72px;
        }

        .logo {
            font-family: 'Cormorant Garamond', serif;
            font-size: 20px;
            font-weight: 400;
            letter-spacing: 0.2em;
            text-decoration: none;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: var(--text);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-icon svg {
            width: 16px;
            height: 16px;
            stroke: var(--white);
        }

        .nav-breadcrumb {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: var(--text-muted);
        }

        .nav-breadcrumb a {
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.2s;
        }

        .nav-breadcrumb a:hover {
            color: var(--text);
        }

        .nav-breadcrumb span {
            color: var(--accent);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--accent) 0%, #D4C4A8 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--white);
            font-weight: 500;
            font-size: 14px;
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            font-size: 13px;
            color: var(--text-muted);
            text-decoration: none;
            border: 1px solid var(--border);
            border-radius: 2px;
            transition: all 0.2s;
            cursor: pointer;
            background: transparent;
            font-family: 'DM Sans', sans-serif;
        }

        .btn-back:hover {
            border-color: var(--text);
            color: var(--text);
        }

        .btn-back svg {
            width: 16px;
            height: 16px;
        }

        /* Main Content */
        .main {
            padding-top: 72px;
            min-height: 100vh;
        }

        .page-header {
            background: var(--white);
            border-bottom: 1px solid var(--border);
            padding: 48px 0;
        }

        .page-header .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 48px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .page-title-group h1 {
            font-size: 42px;
            margin-bottom: 8px;
        }

        .page-title-group p {
            color: var(--text-muted);
            font-size: 15px;
        }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 28px;
            background: var(--text);
            color: var(--white);
            border: none;
            border-radius: 2px;
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary:hover {
            background: #333;
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .btn-primary svg {
            width: 18px;
            height: 18px;
        }

        /* Content Area */
        .content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 48px;
        }

        /* Shop Grid */
        .shop-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 32px;
        }

        /* Shop Card */
        .shop-card {
            background: var(--white);
            border-radius: 4px;
            border: 1px solid var(--border);
            overflow: visible;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            display: flex;
            flex-direction: column;
            min-height: 320px;
        }

        .shop-card:hover {
            border-color: var(--accent);
            transform: translateY(-6px);
            box-shadow: var(--shadow-lg);
        }

        .shop-card-header {
            height: 148px;
            flex-shrink: 0;
            background: linear-gradient(135deg, #2A2A2A 0%, #1A1A1A 100%);
            position: relative;
            overflow: visible;
        }

        .shop-card-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
            opacity: 0.03;
            z-index: 0;
        }

        .shop-card-header::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0.2), transparent 60%);
            z-index: 1;
        }

        .shop-logo {
            position: absolute;
            top: 24px;
            left: 24px;
            width: 80px;
            height: 80px;
            background: var(--white);
            border-radius: 50%;
            border: 3px solid var(--white);
            box-shadow: var(--shadow-md);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            z-index: 10;
        }

        .shop-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .shop-logo-placeholder {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--accent) 0%, #D4C4A8 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .shop-logo-placeholder svg {
            width: 28px;
            height: 28px;
            stroke: var(--white);
        }

        .shop-card-actions {
            position: absolute;
            top: 16px;
            right: 16px;
            display: flex;
            gap: 8px;
            opacity: 0;
            transform: translateY(-8px);
            transition: all 0.3s;
            z-index: 20;
        }

        .shop-card:hover .shop-card-actions {
            opacity: 1;
            transform: translateY(0);
        }

        .shop-action-btn {
            width: 36px;
            height: 36px;
            background: rgba(255,255,255,0.95);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .shop-action-btn:hover {
            transform: scale(1.1);
        }

        .shop-action-btn svg {
            width: 16px;
            height: 16px;
            stroke: var(--text);
        }

        .shop-action-btn.delete:hover {
            background: var(--error);
        }

        .shop-action-btn.delete:hover svg {
            stroke: var(--white);
        }

        .shop-card-body {
            padding: 24px 32px 32px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .shop-name {
            font-family: 'Cormorant Garamond', serif;
            font-size: 24px;
            margin-bottom: 16px;
            padding-right: 0;
        }

        .shop-info-list {
            flex: 1;
        }

        .shop-info-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 12px;
            font-size: 14px;
            color: var(--text-muted);
        }

        .shop-info-item svg {
            width: 18px;
            height: 18px;
            stroke: var(--accent);
            flex-shrink: 0;
            margin-top: 2px;
        }

        .shop-info-item span {
            line-height: 1.5;
            word-break: break-word;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 120px 48px;
            background: var(--white);
            border: 1px dashed var(--border);
            border-radius: 4px;
        }

        .empty-state-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 32px;
            background: var(--accent-light);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .empty-state-icon svg {
            width: 40px;
            height: 40px;
            stroke: var(--accent);
        }

        .empty-state h2 {
            font-size: 28px;
            margin-bottom: 12px;
        }

        .empty-state p {
            color: var(--text-muted);
            margin-bottom: 32px;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background: var(--white);
            width: 100%;
            max-width: 520px;
            max-height: 90vh;
            overflow-y: auto;
            border-radius: 4px;
            position: relative;
            transform: translateY(30px) scale(0.95);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .modal-overlay.active .modal {
            transform: translateY(0) scale(1);
        }

        .modal-header {
            padding: 40px 48px 32px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 {
            font-size: 28px;
        }

        .modal-close {
            width: 40px;
            height: 40px;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .modal-close:hover {
            border-color: var(--text);
            background: var(--text);
        }

        .modal-close:hover svg {
            stroke: var(--white);
        }

        .modal-close svg {
            width: 18px;
            height: 18px;
            stroke: var(--text);
            transition: stroke 0.2s;
        }

        .modal-body {
            padding: 40px 48px;
        }

        .form-group {
            margin-bottom: 28px;
        }

        .form-group label {
            display: block;
            font-size: 11px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .form-group input {
            width: 100%;
            padding: 16px 0;
            font-family: 'DM Sans', sans-serif;
            font-size: 16px;
            border: none;
            border-bottom: 1px solid var(--border);
            background: transparent;
            transition: border-color 0.2s;
            outline: none;
        }

        .form-group input:focus {
            border-color: var(--accent);
        }

        .form-group input::placeholder {
            color: var(--text-muted);
            opacity: 0.6;
        }

        .form-hint {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 8px;
        }

        .modal-footer {
            padding: 24px 48px 40px;
            display: flex;
            gap: 16px;
            justify-content: flex-end;
        }

        .btn-secondary {
            padding: 14px 28px;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.05em;
            border-radius: 2px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-secondary:hover {
            border-color: var(--text);
            background: var(--text);
            color: var(--white);
        }

        .btn-submit {
            padding: 14px 28px;
            background: var(--text);
            border: none;
            color: var(--white);
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.05em;
            border-radius: 2px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-submit:hover {
            background: #333;
        }

        .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Loading */
        .loading {
            position: fixed;
            inset: 0;
            background: rgba(250, 250, 248, 0.9);
            z-index: 300;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }

        .loading.active {
            opacity: 1;
            visibility: visible;
        }

        .loading-spinner {
            width: 48px;
            height: 48px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--text);
            color: var(--white);
            padding: 16px 32px;
            border-radius: 4px;
            font-size: 14px;
            opacity: 0;
            transition: all 0.3s;
            z-index: 250;
        }

        .toast.active {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .toast.error {
            background: var(--error);
        }

        .toast.success {
            background: var(--success);
        }

        /* Animations */
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .shop-card {
            animation: fadeUp 0.5s ease forwards;
        }

        .shop-card:nth-child(1) { animation-delay: 0.05s; }
        .shop-card:nth-child(2) { animation-delay: 0.1s; }
        .shop-card:nth-child(3) { animation-delay: 0.15s; }
        .shop-card:nth-child(4) { animation-delay: 0.2s; }
        .shop-card:nth-child(5) { animation-delay: 0.25s; }
        .shop-card:nth-child(6) { animation-delay: 0.3s; }

        /* Responsive */
        @media (max-width: 768px) {
            header .container {
                padding: 0 24px;
            }

            .page-header .container {
                flex-direction: column;
                align-items: flex-start;
                gap: 24px;
                padding: 0 24px;
            }

            .content {
                padding: 24px;
            }

            .shop-grid {
                grid-template-columns: 1fr;
            }

            .modal {
                margin: 24px;
                max-height: calc(100vh - 48px);
            }

            .modal-header,
            .modal-body,
            .modal-footer {
                padding-left: 24px;
                padding-right: 24px;
            }
        }
    </style>
</head>
<body>
    <!-- Loading -->
    <div class="loading" id="loading">
        <div class="loading-spinner"></div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- Header -->
    <header>
        <div class="container">
            <a href="index.html" class="logo">
                <div class="logo-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M6 3h12l4 6-10 13L2 9z"/>
                    </svg>
                </div>
                BARBERSHOP
            </a>
            <nav class="nav-breadcrumb">
                <a href="index.html">首页</a>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                    <polyline points="9 18 15 12 9 6"/>
                </svg>
                <span>店铺管理</span>
            </nav>
            <div class="user-info">
                <div class="user-avatar" id="userAvatar">李</div>
                <button class="btn-back" onclick="logout()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                        <polyline points="16 17 21 12 16 7"/>
                        <line x1="21" y1="12" x2="9" y2="12"/>
                    </svg>
                    退出
                </button>
            </div>
        </div>
    </header>

    <!-- Main -->
    <main class="main">
        <div class="page-header">
            <div class="container">
                <div class="page-title-group">
                    <h1>店铺管理</h1>
                    <p>管理您的店铺信息，让顾客更好地了解您</p>
                </div>
                <button class="btn-primary" onclick="openShopModal()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19"/>
                        <line x1="5" y1="12" x2="19" y2="12"/>
                    </svg>
                    添加店铺
                </button>
            </div>
        </div>

        <div class="content">
            <div class="shop-grid" id="shopGrid">
                <!-- Shops will be loaded here -->
            </div>

            <!-- Empty State -->
            <div class="empty-state" id="emptyState" style="display: none;">
                <div class="empty-state-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                        <polyline points="9 22 9 12 15 12 15 22"/>
                    </svg>
                </div>
                <h2>暂无店铺</h2>
                <p>创建您的第一家店铺，开始优雅的管理之旅</p>
                <button class="btn-primary" onclick="openShopModal()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19"/>
                        <line x1="5" y1="12" x2="19" y2="12"/>
                    </svg>
                    添加店铺
                </button>
            </div>
        </div>
    </main>

    <!-- Shop Modal -->
    <div class="modal-overlay" id="shopModal">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modalTitle">添加店铺</h2>
                <button class="modal-close" onclick="closeShopModal()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
            <form id="shopForm" onsubmit="handleShopSubmit(event)">
                <div class="modal-body">
                    <input type="hidden" id="shopId" name="id">
                    <div class="form-group">
                        <label>店铺名称</label>
                        <input type="text" id="shopName" name="name" placeholder="输入店铺名称" required>
                    </div>
                    <div class="form-group">
                        <label>店铺 Logo</label>
                        <input type="url" id="shopLogo" name="logo" placeholder="输入 Logo 图片地址（可选）">
                        <p class="form-hint">支持图片链接，将显示在店铺卡片上</p>
                    </div>
                    <div class="form-group">
                        <label>店铺地址</label>
                        <input type="text" id="shopAddress" name="address" placeholder="输入详细地址">
                    </div>
                    <div class="form-group">
                        <label>联系电话</label>
                        <input type="tel" id="shopPhone" name="phone" placeholder="输入联系电话">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-secondary" onclick="closeShopModal()">取消</button>
                    <button type="submit" class="btn-submit" id="submitBtn">保存</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_BASE = '/api/barbershop';
        let shops = [];
        let editingShopId = null;

        // Check auth
        function checkAuth() {
            const token = localStorage.getItem('token');
            const member = localStorage.getItem('member');
            if (!token || !member) {
                window.location.href = 'index.html';
                return;
            }
            const user = JSON.parse(member);
            document.getElementById('userAvatar').textContent = (user.memberName || user.username || 'U').charAt(0).toUpperCase();
        }

        // API calls
        async function apiCall(endpoint, method, body) {
            const token = localStorage.getItem('token');
            const options = {
                method,
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                }
            };
            if (body) {
                options.body = JSON.stringify(body);
            }
            const response = await fetch(`${API_BASE}${endpoint}`, options);
            return response.json();
        }

        // Load shops
        async function loadShops() {
            showLoading(true);
            try {
                const data = await apiCall('/shop/list', 'GET');
                if (data.code === 20000) {
                    shops = data.data || [];
                    console.log('店铺', shops);
                    renderShops();
                } else {
                    showToast(data.message || '加载店铺失败', 'error');
                }
            } catch (e) {
                showToast('加载店铺失败，请检查后端服务', 'error');
            }
            showLoading(false);
        }

        // Render shops
        function renderShops() {
            const grid = document.getElementById('shopGrid');
            const empty = document.getElementById('emptyState');

            if (shops.length === 0) {
                grid.style.display = 'none';
                empty.style.display = 'block';
                return;
            }

            grid.style.display = 'grid';
            empty.style.display = 'none';

            grid.innerHTML = shops.map(shop => `
                <div class="shop-card">
                    <div class="shop-card-header">
                        <div class="shop-card-actions">
                            <button class="shop-action-btn" onclick='editShop("${shop.id}")' title="编辑">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                                </svg>
                            </button>
                            <button class="shop-action-btn delete" onclick='deleteShop("${shop.id}")' title="删除">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <polyline points="3 6 5 6 21 6"/>
                                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div class="shop-logo">
                        ${shop.logo
                            ? `<img src="${shop.logo}" alt="${shop.name}">`
                            : `<div class="shop-logo-placeholder">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                    <path d="M6 3h12l4 6-10 13L2 9z"/>
                                </svg>
                               </div>`
                        }
                    </div>
                    <div class="shop-card-body">
                        <h3 class="shop-name">${shop.name}</h3>
                        <div class="shop-info-list">
                            <div class="shop-info-item">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
                                    <circle cx="12" cy="10" r="3"/>
                                </svg>
                                <span>${shop.address || '暂未填写地址'}</span>
                            </div>
                            <div class="shop-info-item">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
                                </svg>
                                <span>${shop.phone || '暂未填写电话'}</span>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Open shop modal
        function openShopModal(shopId = null) {
            editingShopId = shopId;
            const modal = document.getElementById('shopModal');
            const form = document.getElementById('shopForm');
            const title = document.getElementById('modalTitle');

            form.reset();

            if (shopId) {
                const shop = shops.find(s => s.id === shopId);
                if (shop) {
                    title.textContent = '编辑店铺';
                    document.getElementById('shopId').value = shop.id;
                    document.getElementById('shopName').value = shop.name || '';
                    document.getElementById('shopLogo').value = shop.logo || '';
                    document.getElementById('shopAddress').value = shop.address || '';
                    document.getElementById('shopPhone').value = shop.phone || '';
                }
            } else {
                title.textContent = '添加店铺';
                document.getElementById('shopId').value = '';
            }

            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        // Close shop modal
        function closeShopModal() {
            document.getElementById('shopModal').classList.remove('active');
            document.body.style.overflow = '';
            editingShopId = null;
        }

        // Edit shop
        function editShop(id) {
            openShopModal(id);
        }

        // Handle shop form submit
        async function handleShopSubmit(e) {
            e.preventDefault();

            const form = e.target;
            const id = document.getElementById('shopId').value;
            const shopData = {
                name: form.name.value.trim(),
                logo: form.logo.value.trim(),
                address: form.address.value.trim(),
                phone: form.phone.value.trim()
            };

            if (!shopData.name) {
                showToast('请输入店铺名称', 'error');
                return;
            }

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = '保存中...';

            try {
                let data;
                if (id) {
                    data = await apiCall(`/shop/${id}`, 'PUT', shopData);
                } else {
                    data = await apiCall('/shop', 'POST', shopData);
                }

                if (data.code === 20000) {
                    showToast(id ? '店铺更新成功' : '店铺创建成功', 'success');
                    closeShopModal();
                    loadShops();
                } else {
                    showToast(data.message || '保存失败', 'error');
                }
            } catch (e) {
                showToast('保存失败，请检查后端服务', 'error');
            }

            submitBtn.disabled = false;
            submitBtn.textContent = '保存';
        }

        // Delete shop
        async function deleteShop(id) {
            console.log('delete id ', id)
            if (!confirm('确定要删除该店铺吗？此操作不可恢复。')) {
                return;
            }

            showLoading(true);
            try {
                const data = await apiCall(`/shop/${id}`, 'DELETE');
                if (data.code === 20000) {
                    showToast('店铺已删除', 'success');
                    loadShops();
                } else {
                    showToast(data.message || '删除失败', 'error');
                }
            } catch (e) {
                showToast('删除失败，请检查后端服务', 'error');
            }
            showLoading(false);
        }

        // Logout
        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('member');
            window.location.href = 'index.html';
        }

        // Loading
        function showLoading(show) {
            document.getElementById('loading').classList.toggle('active', show);
        }

        // Toast
        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast active ' + type;
            setTimeout(() => {
                toast.classList.remove('active');
            }, 3000);
        }

        // Init
        checkAuth();
        loadShops();

        // Close modal on escape
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeShopModal();
            }
        });
    </script>
</body>
</html>
