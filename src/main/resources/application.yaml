server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: ${SERVER_SERVLET_CONTEXT_PATH:/barbershop}
spring:
  application:
    name: barbershop
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/barbershop?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useLegacyDatetimeCode=false}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:123456}
    hikari:
      # 连接池最大连接数
      maximum-pool-size: 10
      # 空闲时保持最小连接数
      minimum-idle: 2
      # 空闲连接存活时间
      idle-timeout: 300000
      # 连接最大生命周期时长
      max-lifetime: 900000
      # 连接超时时间
      connection-timeout: 20000
      # 连接测试sql
      connection-test-query: select 1
  mail:
    host: ${MAIL_HOST:smtp.163.com}
    username: ${MAIL_USERNAME:15867153769@163.com}
    password: ${MAIL_PASSWORD:XOCGWKJBWYFWPAVI}
    default-encoding: UTF-8
  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 22MB
      file-size-threshold: 2MB
  jackson:
    deserialization:
      fail-on-unknown-properties: false
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:redis123456}
    database: ${REDIS_DATABASE:0}
  flyway:
    # 非空迁移时，设置基线
    baseline-on-migrate: true
    locations:
      - classpath:db/migration
jwt:
  secret: ${JWT_SECRET:jAhi27Nmj9shXs7lsOvobA4hpjC5VNk9VF8DoM6yqTU=}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:86400}
mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
logging:
  level:
    # 设置 MyBatis Mapper 接口的日志级别为 DEBUG
    com.slm.barbershop.mapper: DEBUG
    # 设置 MyBatis 相关包的日志级别
    org.mybatis: DEBUG
    org.apache.ibatis: DEBUG
    # 覆盖特定类的日志
    org.mybatis.spring.mapper.ClassPathMapperScanner: INFO
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:barbershop}
  public-base-url: ${MINIO_PUBLIC_BASE_URL:http://localhost:9000}