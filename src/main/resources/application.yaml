server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: ${SERVER_SERVLET_CONTEXT_PATH:/barbershop}
spring:
  application:
    name: barbershop
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/barbershop}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:123456}
    hikari:
      # 连接池最大连接数
      maximum-pool-size: 10
      # 空闲时保持最小连接数
      minimum-idle: 2
      # 空闲连接存活时间
      idle-timeout: 300000
      # 连接最大生命周期时长
      max-lifetime: 900000
      # 连接超时时间
      connection-timeout: 20000
      # 连接测试sql
      connection-test-query: select 1
jwt:
  secret: ${JWT_SECRET:jAhi27Nmj9shXs7lsOvobA4hpjC5VNk9VF8DoM6yqTU=}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:86400}
mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
logging:
  level:
    # 设置 MyBatis Mapper 接口的日志级别为 DEBUG
    com.slm.barbershop.mapper: DEBUG
    # 设置 MyBatis 相关包的日志级别
    org.mybatis: DEBUG
    org.apache.ibatis: DEBUG
    # 覆盖特定类的日志
    org.mybatis.spring.mapper.ClassPathMapperScanner: INFO
