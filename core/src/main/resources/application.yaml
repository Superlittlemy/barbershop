server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: ${SERVER_SERVLET_CONTEXT_PATH:/barbershop}
spring:
  application:
    name: barbershop
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/barbershop?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useLegacyDatetimeCode=false}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:123456}
    hikari:
      maximum-pool-size: 10     # 按 CPU 核数和实例数估算，连接数 = CPU核数 × 2 + 有效磁盘数
      minimum-idle: 10          # 建议等于 maximum-pool-size，固定连接池大小，避免频繁创建/销毁连接
      idle-timeout: 300000      # 5 分钟，仅当 minimum-idle < maximum-pool-size 时才生效
      max-lifetime: 900000      # 15 分钟，需 < 数据库 wait_timeout
      connection-timeout: 30000 # 30 秒，按业务容忍度调整
      # connection-test-query: select 1 # 一般省略，依赖 JDBC4 isValid()
  mail:
    host: ${MAIL_HOST:}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
  jackson:
    deserialization:
      fail-on-unknown-properties: false
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:redis123456}
    database: ${REDIS_DATABASE:0}
  flyway:
    # 非空迁移时，设置基线
    baseline-on-migrate: true
    locations:
      - classpath:db/migration
jwt:
  secret: ${JWT_SECRET:jAhi27Nmj9shXs7lsOvobA4hpjC5VNk9VF8DoM6yqTU=}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:86400}
mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
#logging:
#  level:
#    # 设置 MyBatis Mapper 接口的日志级别为 DEBUG
#    com.slm.barbershop.mapper: DEBUG
#    # 设置 MyBatis 相关包的日志级别
#    org.mybatis: DEBUG
#    org.apache.ibatis: DEBUG
#    # 覆盖特定类的日志
#    org.mybatis.spring.mapper.ClassPathMapperScanner: INFO
management:
  endpoints:
    web:
      exposure:
        include: "prometheus,health,info,metrics"
  endpoint:
    prometheus:
      enabled: true
  metrics:
    tags:
      # 为所有指标添加应用名称全局标签，方便 Grafana 多应用过滤
      application: ${spring.application.name:barbershop}
    distribution:
      # 开启直方图与百分位数计算，用于计算 P50/P90/P99 耗时
      percentiles-histogram:
        http.server.requests: true
      sla:
        http.server.requests: 100ms, 500ms, 1s

springdoc-info:
  title: 理发店接口文档
  description: 理发店管理系统 OpenAPI 3.0 接口文档
  version: v1.0.3
  contact-name: Superlittlemy